<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="kyraBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#78350F" stop-opacity="0.2" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="118" fill="url(#kyraBg)" />
  <rect width="504" height="504" x="4" y="4" rx="114" fill="none" stroke="url(#goldBorder)" stroke-width="8" />

  <!-- Stylized Geometric "K" -->
  <g filter="url(#goldGlow)">
    <!-- Vertical Pillar -->
    <rect x="130" y="116" width="62" height="280" rx="16" fill="url(#goldGrad)" />
    
    <!-- Top-Right Diagonal -->
    <path d="M 215 285 L 332 136 C 338 128 350 128 357 135 L 375 152 C 382 159 381 170 374 177 L 272 290 Z" fill="url(#goldGrad)" />
    
    <!-- Bottom-Right Diagonal -->
    <path d="M 252 268 L 368 376 C 375 383 376 394 369 401 L 350 417 C 343 423 332 423 325 415 L 208 300 Z" fill="url(#goldGrad)" />
    
    <!-- Sparkle / Crown Accent -->
    <circle cx="370" cy="110" r="14" fill="#FDE68A" />
  </g>
</svg>
